version: 1
metrics:
  - {name: 服务费收入,   expr: "sum(bill_amt)", desc: "月度账单金额合计（账单行）"}
  - {name: 回款额,       expr: "sum(pay_amt)", desc: "回款记录金额合计（回款行）"}
  - {name: 回款率,       expr: "round(sum(pay_amt) / nullif(sum(bill_amt), 0), 4)", format: percent, desc: "回款额 ÷ 服务费收入；收入为 0 时为空"}
  - {name: 应收余额,     expr: "sum(bill_amt) - sum(pay_amt)", desc: "累计服务费收入 − 累计回款额（全期口径，不做跨月滚存）"}
  - {name: 人力成本,     expr: "sum(cost_amt)", desc: "外派在册员工的月薪资成本（工资+社保+公积金合并列）合计"}
  - {name: 毛利,         expr: "sum(gross_amt)", desc: "服务费收入 − 人力成本（收入减在册人力口径）"}
  - {name: 毛利率,       expr: "round(sum(gross_amt) / nullif(sum(bill_amt), 0), 4)", format: percent, desc: "毛利 ÷ 服务费收入"}
  - {name: 外派人数,     expr: "count(distinct case when entry_type = '在册' then employee_no end)", desc: "去重外派员工数（在册行）"}
  - {name: 人均产值,     expr: "round(sum(bill_amt) / nullif(count(distinct case when entry_type = '在册' then employee_no end), 0), 2)", desc: "服务费收入 ÷ 外派人数"}
  - {name: 人均人力成本, expr: "round(sum(cost_amt) / nullif(count(distinct case when entry_type = '在册' then employee_no end), 0), 2)", desc: "人力成本 ÷ 外派人数"}
  - {name: 在单客户数,   expr: "count(distinct case when entry_type = '账单' then customer_code end)", desc: "有台账记录的去重客户数"}
  - {name: 在单合同数,   expr: "count(distinct case when entry_type = '账单' then contract_no end)", desc: "有台账记录的去重合同数"}
