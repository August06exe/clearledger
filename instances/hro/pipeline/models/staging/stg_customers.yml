version: 2

models:
  - name: stg_customers
    description: 客户（清洗层，由字段契约生成）
    columns:
      - name: customer_code
        description: 客户编码（string）
        data_tests:
          - not_null
          - unique
      - name: customer_name
        description: 客户名称（string）
      - name: industry
        description: 行业（string）
        data_tests:
          - accepted_values:
              arguments:
                values: ['金融', '互联网', '制造', '零售']
              config:
                severity: warn
      - name: customer_level
        description: 客户级别（string）
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C']
              config:
                severity: warn
