# 生成物：报表模型列元数据（门店经营排行）
version: 2

models:
  - name: mart_store_rank
    description: 门店经营排行（维度 × 指标汇总）
    columns:
      - name: "门店"
        description: 分组维度
      - name: "营业额"
        description: 订单金额合计（折前口径，未扣折扣）
      - name: "毛利"
        description: 营业额 − 成本额
      - name: "客单数"
        description: 去重订单数（一单多菜品行计 1）
      - name: "毛利率"
        description: 毛利 ÷ 营业额；营业额为 0 时为空
