# 生成物：报表模型列元数据（行业毛利月报）
version: 2

models:
  - name: mart_industry_margin
    description: 行业毛利月报（维度 × 指标汇总）
    columns:
      - name: "月份"
        description: 时间维度（month）
      - name: "行业"
        description: 分组维度
      - name: "收入"
        description: 客户合同收入合计（不含摊销与补助）
      - name: "毛利"
        description: 收入 + 摊销收入 − 人力成本（L3 层毛利口径）
      - name: "毛利率"
        description: 毛利 ÷ 收入合计；分层报表由可加部分重算，不做比率求和
