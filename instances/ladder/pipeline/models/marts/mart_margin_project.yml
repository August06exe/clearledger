# 生成物：报表模型列元数据（L2 项目毛利月报）
version: 2

models:
  - name: mart_margin_project
    description: L2 项目毛利月报（维度 × 指标汇总）
    columns:
      - name: "月份"
        description: 时间维度（month）
      - name: "项目"
        description: 分组维度
      - name: "工资奖金"
        description: 外包员工工资与项目奖金（数据集成层按项目×月聚合）
      - name: "社保公积金"
        description: 五险一金企业缴纳部分；缴纳状态以集成层为准
      - name: "招聘费"
        description: 项目维度归集的招聘渠道费与内推奖金(TS)
      - name: "人力成本"
        description: 工资奖金 + 社保公积金 + 招聘费，即 L2 层人力成本合计
      - name: "毛利"
        description: 收入 + 摊销收入 − 人力成本（L3 层毛利口径）
      - name: "毛利率"
        description: 毛利 ÷ 收入合计；分层报表由可加部分重算，不做比率求和
