version: 2

models:
  - name: stg_customers
    description: 客户主数据（清洗层，由字段契约生成）
    columns:
      - name: customer_code
        description: 客户编码（string）
        data_tests:
          - not_null
          - unique
      - name: customer_name
        description: 客户名称（string）
        data_tests:
          - not_null
