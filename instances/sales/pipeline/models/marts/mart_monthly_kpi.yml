# 生成物：报表模型列元数据（经营月报（公司级））
version: 2

models:
  - name: mart_monthly_kpi
    description: 经营月报（公司级）（维度 × 指标汇总）
    columns:
      - name: "月份"
        description: 分组维度
      - name: "收入"
        description: 订单金额 × (1−折扣率) 的合计；折扣率缺失按 0 处理
      - name: "成本"
        description: 数量 × 商品标准成本 的合计（标准成本法，非实际采购价）
      - name: "毛利"
        description: 收入 − 成本
      - name: "毛利率"
        description: 毛利 ÷ 收入；收入为 0 时为空
