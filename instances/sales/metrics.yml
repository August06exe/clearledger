# 实例一：指标口径（唯一出处）——desc 为界面展示的中文口径说明
version: 1
metrics:
  - {name: 收入,     expr: "sum(net_amount)",   desc: "订单金额 × (1−折扣率) 的合计；折扣率缺失按 0 处理"}
  - {name: 成本,     expr: "sum(cost_amount)",  desc: "数量 × 商品标准成本 的合计（标准成本法，非实际采购价）"}
  - {name: 毛利,     expr: "sum(gross_profit)", desc: "收入 − 成本"}
  - {name: 毛利率,   expr: "round(sum(gross_profit) / nullif(sum(net_amount), 0), 4)", format: percent, desc: "毛利 ÷ 收入；收入为 0 时为空"}
  - {name: 订单行数, expr: "count(*)",          desc: "宽表行数（订单商品行，非订单数）"}
  - {name: 客户数,   expr: "count(distinct customer_id)", desc: "去重客户数"}
