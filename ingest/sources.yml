# 明账 ClearLedger — 数据源接入配置（清洗规则即代码的一部分）
#
# 每个数据源：扫描 data/inbox/ 中的文件 → 按 column_map 做列名标准化 →
# 数值/日期列强类型化 → 落入 DuckDB 的 raw 层（快照式全量覆盖）。
# 接入新数据源 = 在这里加一段配置 + 让 AI 生成对应 stg 模型，无需改摄取代码。

version: 1
inbox_dir: ../data/inbox

sources:
  - name: sales_transactions
    title: 销售流水
    format: csv
    files: ["sales_transactions.csv"]
    description: 订单级销售流水，来自业务系统导出，快照式全量
    date_columns: [order_date]
    numeric_columns: [quantity, unit_price, discount_rate, amount]
    column_map:
      订单号: order_id
      订单日期: order_date
      客户编号: customer_id
      商品编号: product_id
      数量: quantity
      单价: unit_price
      折扣率: discount_rate
      金额: amount

  - name: customers
    title: 客户主数据（含标签）
    format: xlsx
    files: ["customers.xlsx"]
    description: 客户档案与业务标签（行业/等级/区域/状态），维度表
    date_columns: []
    numeric_columns: []
    column_map:
      客户编号: customer_id
      客户名称: customer_name
      行业: industry
      客户等级: level
      区域编码: region_code
      区域: region_name
      状态: status

  - name: products
    title: 商品主数据
    format: xlsx
    files: ["products.xlsx"]
    description: 商品档案与标准成本，毛利计算的口径基准
    date_columns: []
    numeric_columns: [std_price, std_cost]
    column_map:
      商品编号: product_id
      商品名称: product_name
      品类: category
      单位: unit
      标准单价: std_price
      标准成本: std_cost

  - name: org_structure
    title: 组织架构
    format: csv
    files: ["org_structure.csv"]
    description: 部门树（集团-事业部-职能），费用归集与分摊的依据
    date_columns: []
    numeric_columns: []
    column_map:
      部门编码: dept_code
      部门名称: dept_name
      上级部门编码: parent_code
      层级: dept_level
      是否销售部门: is_sales_dept
      负责区域编码: region_code

  - name: expenses
    title: 部门费用流水
    format: xlsx
    files: ["expenses.xlsx"]
    description: 部门月度费用，净利 = 毛利 - 分摊费用的输入
    date_columns: [expense_date]
    numeric_columns: [amount]
    column_map:
      记账日期: expense_date
      部门编码: dept_code
      部门名称: dept_name
      费用类别: category
      金额: amount
