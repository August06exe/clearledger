version: 2

models:
  - name: int_sales_enriched
    description: >
      销售宽表（订单行级）：流水关联客户标签与商品主数据后的加工层，
      全公司所有收入/成本/毛利口径的唯一出处。
    columns:
      - name: order_id
        description: 订单行编号
        data_tests: [not_null, unique]
      - name: order_date
        description: 订单日期
        data_tests: [not_null]
      - name: customer_id
        description: 客户编号
      - name: customer_name
        description: 客户名称
      - name: industry
        description: 标签·行业
      - name: customer_level
        description: 标签·客户等级
      - name: region_code
        description: 标签·区域编码
      - name: region_name
        description: 标签·区域名称
      - name: customer_status
        description: 标签·客户状态
      - name: product_id
        description: 商品编号
      - name: product_name
        description: 商品名称
      - name: category
        description: 标签·品类
      - name: quantity
        description: 数量
      - name: gross_amount
        description: 订单金额（折前）= 数量 × 单价
      - name: discount_rate
        description: 折扣率
      - name: net_amount
        description: 收入口径 = 订单金额 × (1 − 折扣率)
        data_tests: [not_null]
      - name: cost_amount
        description: 成本口径 = 数量 × 商品标准成本
      - name: gross_profit
        description: 毛利 = 折后金额 − 成本金额

  - name: int_expense_alloc
    description: >
      费用分摊层：事业部费用直接归属区域，总部/职能费用按当月区域收入占比分摊；
      全公司零收入的月份按区域数均摊（兜底，费用不蒸发）。
      输出粒度：月 × 部门 × 费用类别 × 区域。
    columns:
      - name: month
        description: 费用月份
        data_tests: [not_null]
      - name: dept_code
        description: 费用发生部门
      - name: dept_name
        description: 部门名称
      - name: category
        description: 费用类别
      - name: region_code
        description: 承担该笔费用的区域
      - name: expense_amount
        description: 部门原始费用（分摊行按区域重复出现，仅供溯源，不可直接汇总）
      - name: allocated_amount
        description: 分摊到区域的费用（可直接汇总）
        data_tests: [not_null]
